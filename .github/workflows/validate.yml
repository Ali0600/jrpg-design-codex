name: Validate & Deploy

# The codex is a single HTML file that IS the database, so validation gates the
# deploy: nothing reaches Pages that hasn't passed the structural checks.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate the codex
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # check_changes.mjs reads the codex at the base revision, which a shallow
          # clone does not contain.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # --selftest sabotages the data in memory and requires every check to fire,
      # so a rotted no-op gate fails the build instead of passing it.
      - name: Structural validation (+ prove the checks can fail)
        run: node scripts/validate_codex.mjs --selftest

      # Offline: the GameFAQs probe against synthetic fixtures, plus the digest lint.
      - name: Probe tests + splicer tests + row-writer tests + cover-fetch tests + digest lint
        run: node --test scripts/gf_probe.test.mjs scripts/splice_rows.test.mjs scripts/check_changes.test.mjs scripts/game_rows.test.mjs scripts/splice_game.test.mjs scripts/fetch_covers.test.mjs

      # Offline: the cover fetcher's byte and host guards, no network calls.
      - name: Cover guards
        run: node scripts/fetch_covers.mjs --selftest

      # A row EDITED in place changes nothing the structural validator can measure, so
      # the app would keep showing it with its original date and the owner's review would
      # miss the edit. This compares against the base revision and requires the edit to be
      # logged. The base sha goes through env, never interpolated into the shell.
      - name: Every rewritten row is logged in CHANGES
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'HEAD~1' }}
        run: node scripts/check_changes.mjs --base "$BASE_SHA"

      # Offline: exercises the score range guards only, no network calls.
      - name: Score guards
        run: python3 scripts/fetch_scores.py --selftest

  deploy:
    name: Deploy to Pages
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Assemble site
        run: |
          mkdir -p _site
          cp JRPG_Design_Codex.html _site/index.html
          # The gallery's images. Validation already proved SHOTS rows and files
          # match 1:1, so a missing folder here should fail the job, not ship empty.
          cp -r shots _site/shots
          # The covers, under the same two-way check.
          cp -r covers _site/covers

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
